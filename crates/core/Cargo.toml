[package]
name = "dugix-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "dugix_core"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[features]
# The OS file dialogs, for frontends with a user at a screen (studio, the TUI).
native-dialogs = ["dep:rfd"]

[dependencies]
# ── Core deps ─────────────────────────────────────────────────────────────
anyhow = { workspace = true }
arboard = { workspace = true }  # device-code login copies the URL to the OS clipboard (config.rs)
base64 = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }  # spreadsheet CSV interchange (sheet/)
directories = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true }
ignore = { workspace = true }
ironcalc = { workspace = true }  # spreadsheet engine: formulas and xlsx (sheet/)
keyring = { workspace = true }  # connector secrets: OS keychain (connectors/secrets.rs)
krilla = { workspace = true }  # vector PDF export for docs and decks (doc/export/pdf.rs)
krilla-svg = { workspace = true }
open = { workspace = true }
pdf-extract = { workspace = true }
png = { workspace = true }
portable-pty = { workspace = true }  # pseudo-terminals for external agent CLIs (fleet.rs)
pulldown-cmark = { workspace = true }
rand = { workspace = true }
resvg = { workspace = true }
reqwest = { workspace = true }
reqwest-eventsource = { workspace = true }
rfd = { workspace = true, optional = true }  # native Open/Save dialogs (canvas/dialogs.rs); frontends enable `native-dialogs`
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
taffy = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tree-sitter = { workspace = true }  # syntax highlighting (highlight.rs)
tree-sitter-bash = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-css = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-highlight = { workspace = true }
tree-sitter-html = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-md = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-ruby = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-toml-ng = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-yaml = { workspace = true }
uuid = { workspace = true }
vt100 = { workspace = true }  # screen model of each fleet agent (fleet.rs)
zip = { workspace = true }

[dev-dependencies]
ironcalc = { workspace = true, features = ["mock_time"] }
